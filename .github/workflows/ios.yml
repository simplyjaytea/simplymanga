name: iOS build

# Path-filtered per project CI policy: macOS runners only spin up when
# app-affecting files change. Public repo = free macOS minutes.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'packages/**'
      - 'rust/**'
      - 'rust_builder/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'packages/**'
      - 'rust/**'
      - 'rust_builder/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze + test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-ios:
    name: Unsigned .ipa (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - name: Rust iOS targets (cargokit builds the Rust core)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: flutter pub get
      # Mihon bridge probe (plan M5): the m_extension_server pod embeds an
      # OpenJDK Zero runtime fetched at pod-install time. If this fails, the
      # fallback is excising the pod + stubbing MihonExtensionService.
      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr simplyMANGA-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: simplyMANGA-unsigned-ipa
          path: simplyMANGA-unsigned.ipa
          retention-days: 14